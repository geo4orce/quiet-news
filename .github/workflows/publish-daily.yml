name: Publish daily edition

on:
  schedule:
    - cron: "7 4 * * *"
      timezone: "America/New_York"
    - cron: "37 4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quiet-news-daily-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the existing publication tree
        run: npm run check

      - name: Generate the completed previous-day edition
        run: npm run job:publisher
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Check the updated publication tree
        run: npm run check

      - name: Commit and publish changed data
        shell: bash
        run: |
          if git diff --quiet -- public/data; then
            echo "The edition is already published."
            exit 0
          fi
          edition_date="$(node -p "JSON.parse(require('fs').readFileSync('public/data/current.json')).edition_date")"
          git config user.name "quiet-news-publisher[bot]"
          git config user.email "quiet-news-publisher[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Publish ${edition_date} digest"
          git push origin HEAD:main
