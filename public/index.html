<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Quiet News publishes one shared daily news edition.">
    <meta name="theme-color" content="#f4f1e9">
    <link rel="canonical" href="https://quiet-news.com/">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2318211d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23f4f1e9'%3EQ%3C/text%3E%3C/svg%3E">
    <title>Quiet News</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f1e9;
        --ink: #18211d;
        --muted: #626b65;
        --line: #cbd0ca;
        --accent: #2f6254;
      }

      * { box-sizing: border-box; }
      html { background: var(--paper); }

      body {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 24px 24px;
        color: var(--ink);
        background: var(--paper);
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.55;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-family: Arial, Helvetica, sans-serif;
      }

      header { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
      h1 { display: flex; align-items: center; gap: 12px; margin: 0; font-size: 1.45rem; letter-spacing: -0.02em; }

      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 50%;
        color: var(--paper);
        background: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      #edition { margin: 0; color: var(--muted); font-size: 0.78rem; text-align: right; text-transform: uppercase; letter-spacing: 0.08em; }
      #archive { padding: 16px 0 0; font-family: Arial, Helvetica, sans-serif; }
      #archive summary { color: var(--accent); cursor: pointer; font-size: 0.8rem; font-weight: 700; }
      #archive-links { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
      #archive-links a { padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); font-size: 0.72rem; text-decoration: none; }
      #archive-links a[aria-current="page"] { color: var(--paper); background: var(--accent); border-color: var(--accent); }
      main { min-height: 50vh; }
      article { padding: 34px 0; border-bottom: 1px solid var(--line); }
      article:last-child { border-bottom: 0; }

      h2 {
        margin: 0 0 12px;
        font-size: clamp(1.75rem, 6vw, 2.65rem);
        line-height: 1.04;
        letter-spacing: -0.035em;
      }

      .summary { margin: 0; color: #36403b; font-size: 1.08rem; }
      .empty { margin: 0; padding: 72px 0; color: var(--muted); font-size: 1.25rem; text-align: center; }

      footer {
        align-items: flex-start;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1.5;
      }

      footer p { margin: 0; }
      footer a { color: var(--ink); }
      .credit { flex: 0 0 auto; }
      .disclaimer { max-width: 430px; text-align: right; }
      [hidden] { display: none !important; }

      @media (max-width: 560px) {
        body { padding: 22px 20px 20px; }
        header { align-items: flex-start; }
        h1 { font-size: 1.25rem; }
        .mark { width: 38px; height: 38px; }
        article { padding: 28px 0; }
        footer { display: block; }
        .disclaimer { margin-top: 10px; text-align: left; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="mark" aria-hidden="true">Q</span> Quiet News</h1>
      <p id="edition">Previous day edition</p>
    </header>

    <details id="archive" hidden>
      <summary>Browse the archive</summary>
      <nav id="archive-links" aria-label="Edition archive"></nav>
    </details>
    <main id="news" aria-live="polite"></main>

    <footer>
      <p class="credit">All rights reserved &copy; 2026<br>Created by <a href="https://web-opt.com/">web-opt.com</a>.</p>
      <p class="disclaimer">For education and information only. Not an official source. Verify important details with the original sources.</p>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
