<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="An AI-powered daily news filter: only the few things worth interrupting your day, with no filler, clickbait, or endless scroll. Some days, nothing.">
    <meta name="keywords" content="quiet news, AI-powered news, AI news filter, daily news filter, curated news, important news, news aggregator alternative, news without clickbait, no doomscrolling, daily news digest">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Quiet News">
    <meta property="og:title" content="Quiet News">
    <meta property="og:description" content="An AI-powered daily news filter: only the few things worth interrupting your day, with no filler, clickbait, or endless scroll. Some days, nothing.">
    <meta property="og:url" content="https://quietnews.ai/">
    <meta property="og:image" content="https://quietnews.ai/social-card.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Quiet News Q logo. AI-powered daily news. Only what earns your attention.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Quiet News">
    <meta name="twitter:description" content="An AI-powered daily news filter: only the few things worth interrupting your day, with no filler, clickbait, or endless scroll. Some days, nothing.">
    <meta name="twitter:image" content="https://quietnews.ai/social-card.png">
    <meta name="twitter:image:alt" content="Quiet News Q logo. AI-powered daily news. Only what earns your attention.">
    <meta name="theme-color" content="#f4f1e9">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://quietnews.ai/">
    <link rel="icon" type="image/svg+xml" href="/quiet-news.svg?v=0.5.0">
    <link rel="stylesheet" href="/styles.css?v=0.5.3">
    <script type="module" src="/app.js?v=0.5.3"></script>
    <title>Quiet News</title>
  </head>
  <body>
    <header>
      <img class="mark" src="/quiet-news.svg?v=0.5.0" alt="Quiet News" width="42" height="42">
      <section id="archive" class="hidden" aria-label="Past days">
        <button id="archive-toggle" type="button" aria-expanded="false" aria-controls="archive-menu">Jump to date</button>
        <div id="archive-menu" class="hidden" role="dialog" aria-label="Jump to a date">
          <div class="calendar-heading">
            <button id="archive-previous" class="calendar-nav" type="button" aria-label="Previous month">&#8249;</button>
            <p id="archive-month" aria-live="polite"></p>
            <button id="archive-next" class="calendar-nav" type="button" aria-label="Next month">&#8250;</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
          </div>
          <div id="archive-calendar" role="grid" aria-labelledby="archive-month"></div>
          <a id="archive-today" class="hidden" href="/">Today</a>
        </div>
      </section>
    </header>
    <main id="news" aria-live="polite">
      <div id="stories" class="hidden" data-news-state></div>
      <p id="news-loading" class="empty" data-news-state>
        <span class="visually-hidden">Loading Quiet News.</span>
        <span class="loading-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
      </p>
      <p id="current-quiet" class="empty hidden" data-news-state>Today is quiet. Come back tomorrow.</p>
      <p id="archive-quiet" class="empty hidden" data-news-state>Quiet.</p>
      <p id="unavailable" class="empty hidden" data-news-state>Unavailable.</p>
      <p id="not-yet" class="empty hidden" data-news-state>Not yet.</p>
      <p id="error" class="empty hidden" data-news-state>Error.</p>
      <template id="story-template">
        <article data-story>
          <h2 data-story-headline></h2>
          <div class="story-details" data-story-details>
            <p class="summary" data-story-body></p>
            <p class="sources" data-story-sources></p>
          </div>
        </article>
      </template>
    </main>

    <footer>
      <p class="footer-copy">
        <span>AI-powered daily news. Only what earns your attention.</span>
        <span>Verify important details with the original sources.</span>
      </p>
      <p class="credit">
        <span>&copy; 2026 <a href="https://web-opt.com/">Web-Opt LLC</a></span>
        <span>All rights reserved.</span>
      </p>
    </footer>
  </body>
</html>
