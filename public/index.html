<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Quiet News publishes one shared daily news edition.">
    <meta name="theme-color" content="#f4f1e9">
    <link rel="canonical" href="https://quiet-news.com/">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2318211d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23f4f1e9'%3EQ%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
    <title>Quiet News</title>
  </head>
  <body>
    <header>
      <h1><span class="mark" aria-hidden="true">Q</span> Quiet News</h1>
      <section id="archive" aria-label="Edition archive" hidden>
        <button id="archive-toggle" type="button" aria-expanded="false" aria-controls="archive-menu">
          <span id="archive-label">Today</span>
        </button>
        <div id="archive-menu" role="dialog" aria-label="Choose an edition" hidden>
          <a id="archive-today" href="/">Today</a>
          <div class="calendar-heading">
            <button id="archive-previous" class="calendar-nav" type="button" aria-label="Previous month">&#8249;</button>
            <p id="archive-month" aria-live="polite"></p>
            <button id="archive-next" class="calendar-nav" type="button" aria-label="Next month">&#8250;</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
          </div>
          <div id="archive-calendar" role="grid" aria-labelledby="archive-month"></div>
        </div>
      </section>
    </header>
    <main id="news" aria-live="polite"></main>

    <footer>
      <p class="credit">All rights reserved &copy; 2026<br>Created by <a href="https://web-opt.com/">web-opt.com</a>.</p>
      <p class="disclaimer">
        <span>For education and information only.</span>
        <span>Not an official source.</span>
        <span>Verify important details with the original sources.</span>
      </p>
    </footer>
  </body>
</html>
